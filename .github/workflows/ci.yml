name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · build · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No Supabase env in CI: the app must build and run without it (health reports "missing_env").
      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (1440×1000 and 390×844)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  supabase:
    name: supabase · RLS tests · auth e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase (migrations + demo seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: RLS tests (pgTAP)
        run: supabase test db

      - name: Export local Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          } >> "$GITHUB_ENV"

      - name: Test fixtures (university domains, test admin)
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          update public.universities
             set email_domains = array['alunos.test'], staff_email_domains = array['docentes.test']
           where slug = 'belas-artes-ulisboa';
          insert into private.admin_emails (email, university_id)
          values ('admin@admin.test', '00000000-0000-4000-8000-000000000001')
          on conflict do nothing;
          SQL

      - name: Build against local Supabase
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Auth e2e (magic links via the local inbox)
        run: pnpm exec playwright test -c playwright.auth.config.ts

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-auth
          path: |
            playwright-report-auth/
            test-results/
          retention-days: 7
